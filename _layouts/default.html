<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header><a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}<span> / JOURNAL</span></a><nav aria-label="主导航"><a href="{{ '/' | relative_url }}">文章</a><a href="{{ '/archive/' | relative_url }}">归档</a><a href="{{ '/about/' | relative_url }}">关于</a></nav></header>
  <main>{{ content }}</main>
  <footer><span>© {{ 'now' | date: '%Y' }} {{ site.title | escape }}</span><span>保持好奇，持续记录。</span></footer>
</body>
</html>
